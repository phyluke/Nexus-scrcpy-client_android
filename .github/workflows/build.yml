name: Build APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs Gradle itself, so no gradle-wrapper.jar is required in the repo.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Check bundled scrcpy-server
        run: |
          if [ -f app/src/main/assets/scrcpy-server ]; then
            echo "scrcpy-server found: $(stat -c%s app/src/main/assets/scrcpy-server) bytes"
          else
            echo "::warning::app/src/main/assets/scrcpy-server is missing - APK will build but streaming won't work"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Rename debug APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/nexus_phyluke.apk

      - uses: actions/upload-artifact@v4
        with:
          name: scrcpy-client-debug-apk
          path: app/build/outputs/apk/debug/nexus_phyluke.apk
          if-no-files-found: error


